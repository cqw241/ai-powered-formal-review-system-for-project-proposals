[project]
name = "guizheng-ai-backend"
version = "0.1.0"
description = "规证AI backend: project persistence, PDF materials, cloud vision adapter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.55.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.28.2",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
